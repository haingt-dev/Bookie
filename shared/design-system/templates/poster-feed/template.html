<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../tokens/tokens.css">
<style>
  body {
    width: 1080px;
    height: 1350px;
    position: relative;
    overflow: hidden;
    background: var(--bookie-scrim);
    display: flex;
    flex-direction: column;
  }

  /* ---------- lớp nền ---------- */
  .bg-layer {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(1200px 900px at 15% 8%, rgba(255,255,255,0.20), transparent 60%),
      linear-gradient(150deg, var(--bookie-green-dark) 0%, #3fa307 55%, var(--bookie-green) 100%);
  }
  .has-bg .bg-layer {
    background-image: url("{{bg_url}}");
    background-size: cover;
    background-position: center;
  }
  .bg-watermark {
    position: absolute;
    right: -180px;
    bottom: 220px;
    width: 720px;
    opacity: 0.14;
    transform: rotate(-8deg);
  }
  .has-bg .bg-watermark { display: none; }

  .scrim {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(18,43,8,0.50) 0%, rgba(18,43,8,0) 22%),
      linear-gradient(180deg, rgba(18,43,8,0) 30%, rgba(18,43,8,0.55) 58%, rgba(18,43,8,0.94) 100%);
  }
  /* nền gen-art thường SÁNG (anchor tông giấy) → dải tiêu đề cần scrim đậm hơn */
  .has-bg .scrim {
    background:
      linear-gradient(180deg, rgba(18,43,8,0.45) 0%, rgba(18,43,8,0.10) 20%),
      linear-gradient(180deg, rgba(18,43,8,0.08) 24%, rgba(18,43,8,0.52) 40%, rgba(18,43,8,0.72) 62%, rgba(18,43,8,0.96) 100%);
  }

  /* ---------- nội dung ---------- */
  header, main, footer { position: relative; z-index: 2; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 56px 64px 0;
  }
  .logo-chip {
    width: 128px;
    height: 128px;
    background: var(--bookie-white);
    border-radius: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-card);
  }
  .logo-chip img { width: 96px; height: 96px; }
  .badge {
    background: var(--bookie-white);
    color: var(--bookie-green-dark);
    font-weight: 800;
    font-size: 34px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 20px 40px;
    border-radius: var(--radius-pill);
    box-shadow: var(--shadow-card);
  }

  main {
    margin-top: auto;
    padding: 0 64px;
  }
  .eyebrow {
    display: inline-block;
    background: var(--bookie-orange);
    color: var(--bookie-white);
    font-weight: 600;
    font-size: 30px;
    letter-spacing: 1px;
    padding: 14px 30px;
    border-radius: var(--radius-pill);
    margin-bottom: 34px;
  }
  h1 {
    color: var(--bookie-white);
    font-weight: 800;
    font-size: 96px;
    line-height: 1.08;
    letter-spacing: -1px;
    text-shadow: 0 4px 24px rgba(18,43,8,0.45);
    margin-bottom: 18px;
  }
  .author {
    color: rgba(255,255,255,0.88);
    font-weight: 600;
    font-size: 40px;
    margin-bottom: 44px;
  }

  .info-card {
    background: var(--bookie-white);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
    padding: 40px 44px;
    display: flex;
    flex-direction: column;
    gap: 26px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 24px;
  }
  .row .ico {
    flex: 0 0 auto;
    width: 60px;
    height: 60px;
    border-radius: 18px;
    background: var(--bookie-green-tint);
    color: var(--bookie-green-dark);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .row .ico svg { width: 32px; height: 32px; }
  .row .txt {
    color: var(--bookie-ink);
    font-weight: 600;
    font-size: 36px;
    line-height: 1.25;
  }

  footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;            /* dang_ky dài → meta wrap xuống dòng, không bao giờ bị cắt */
    row-gap: 20px;
    column-gap: 32px;
    padding: 44px 64px 56px;
  }
  .cta {
    background: var(--bookie-orange);
    color: var(--bookie-white);
    font-weight: 800;
    font-size: 36px;
    padding: 24px 44px;
    border-radius: var(--radius-pill);
    box-shadow: var(--shadow-card);
    white-space: nowrap;
  }
  .meta {
    white-space: nowrap;        /* không nhét vừa hàng → rơi nguyên khối xuống dòng mới */
    margin-left: auto;          /* luôn căn phải, kể cả khi ở dòng riêng */
    text-align: right;
    color: rgba(255,255,255,0.92);
    font-weight: 600;
    font-size: 28px;
    line-height: 1.5;
  }
</style>
</head>
<body class="{{#bg}}has-bg{{/bg}}">
  <div class="bg-layer"></div>
  <img class="bg-watermark" src="../../assets/logo/logomark.png" alt="">
  <div class="scrim"></div>

  <header>
    <div class="logo-chip"><img src="../../assets/logo/logomark.png" alt="Book!e"></div>
    <div class="badge">{{loai_event}}</div>
  </header>

  <main>
    {{#chu_de}}<div class="eyebrow">{{chu_de}}</div>{{/chu_de}}
    <h1 data-fit data-max-lines="3">{{ten_sach}}</h1>
    {{#tac_gia}}<div class="author">{{tac_gia}}</div>{{/tac_gia}}

    <div class="info-card">
      <div class="row">
        <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
        <div class="txt">{{ngay_gio}}</div>
      </div>
      <div class="row">
        <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0 1 18 0Z"/><circle cx="12" cy="10" r="3"/></svg></div>
        <div class="txt">{{dia_diem}}</div>
      </div>
      {{#dien_gia}}
      <div class="row">
        <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg></div>
        <div class="txt">{{dien_gia}}</div>
      </div>
      {{/dien_gia}}
    </div>
  </main>

  <footer>
    <div class="cta">Đăng ký: {{dang_ky}}</div>
    <div class="meta">fb.com/bookie.community<br>{{hashtag}}</div>
  </footer>

<script>
  // co chữ tự động: giảm font-size tới khi tiêu đề nằm gọn trong data-max-lines dòng
  document.querySelectorAll("[data-fit]").forEach((el) => {
    const maxLines = Number(el.dataset.maxLines || 3);
    let size = parseFloat(getComputedStyle(el).fontSize);
    const lineHeightRatio = 1.08;
    while (size > 48 && el.scrollHeight > size * lineHeightRatio * maxLines + 8) {
      size -= 2;
      el.style.fontSize = size + "px";
    }
  });
</script>
</body>
</html>
